name = "forex-bot-heartbeat"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Cron triggers — every minute
[triggers]
crons = ["* * * * *"]

# Secrets (set via `wrangler secret put VERCEL_TICK_URL`):
# VERCEL_TICK_URL = https://your-deployment.vercel.app/api/tick
# HEARTBEAT_SECRET = (optional shared secret)
# FAILOVER_URL = https://your-netlify-site.netlify.app/.netlify/functions/tick
