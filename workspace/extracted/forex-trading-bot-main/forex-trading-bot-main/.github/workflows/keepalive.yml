name: 24-7 Keepalive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: keepalive
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping heartbeat
        env:
          HEARTBEAT_URL: ${{ secrets.VERCEL_HEARTBEAT_URL }}
          TICK_URL: ${{ secrets.VERCEL_TICK_URL }}
          HEARTBEAT_SECRET: ${{ secrets.HEARTBEAT_SECRET }}
        run: |
          set -uo pipefail
          worker="gha-keepalive-${GITHUB_RUN_ID}"
          for url in "$HEARTBEAT_URL" "$TICK_URL"; do
            [ -z "$url" ] && continue
            echo "→ pinging $url"
            code=$(curl -s -o /tmp/body -w "%{http_code}" -X POST "$url" \
              -H "x-heartbeat-secret: ${HEARTBEAT_SECRET}" \
              -H "x-worker-id: ${worker}" \
              --max-time 45 || echo 000)
            echo "  status=$code  body=$(head -c 280 /tmp/body)"
          done
