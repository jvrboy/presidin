name: Telegram Poller (standalone)
on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:
concurrency:
  group: telegram-poller
  cancel-in-progress: true
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Poll Telegram and answer commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_URL: ${{ secrets.BOT_URL }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          bot_url = (os.environ.get("BOT_URL") or "https://forex-trading-bot-lilac.vercel.app").rstrip("/")
          if not token:
              print("no TELEGRAM_BOT_TOKEN")
              raise SystemExit(0)

          def tg(method, payload=None):
              url = f"https://api.telegram.org/bot{token}/{method}"
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"} if data else {})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read())

          def http_get(path):
              try:
                  with urllib.request.urlopen(bot_url + path, timeout=45) as r:
                      return json.loads(r.read())
              except Exception as e:
                  return {"ok": False, "error": str(e)}

          def reply(chat_id, text):
              return tg("sendMessage", {"chat_id": chat_id, "text": text[:3900], "parse_mode": "HTML", "disable_web_page_preview": True})

          # Ensure no webhook blocks getUpdates
          try:
              tg("deleteWebhook", {"drop_pending_updates": False})
          except Exception as e:
              print("deleteWebhook", e)

          updates = tg("getUpdates", {"timeout": 20, "limit": 20})
          results = updates.get("result") or []
          print(f"updates={len(results)}")
          if not results:
              raise SystemExit(0)

          highest = 0
          for u in results:
              highest = max(highest, int(u.get("update_id") or 0))
              msg = u.get("message") or u.get("edited_message") or {}
              text = (msg.get("text") or "").strip()
              chat = (msg.get("chat") or {}).get("id")
              user = (msg.get("from") or {}).get("id")
              if not text or not chat or not text.startswith("/"):
                  continue
              cmd = text.split()[0].split("@")[0].lower().lstrip("/")
              args = text.split()[1:]
              print(f"cmd=/{cmd} chat={chat} user={user}")

              if cmd in ("start", "menu", "help"):
                  reply(chat, "🤖 <b>Forex Bot Control</b>\n\nCommands:\n/status /health /pnl /positions /signals /tick /manage /mode\n/help")
              elif cmd == "status":
                  h = http_get("/api/health")
                  s = http_get("/api/settings")
                  ft = http_get("/api/forward-test")
                  settings = (s or {}).get("settings") or {}
                  metrics = (ft or {}).get("metrics") or {}
                  reply(chat, (
                      f"✅ Health: {h.get('status')}\n"
                      f"Bot enabled: {settings.get('bot_enabled')}\n"
                      f"Conf: {settings.get('confidence_threshold')} stake: {settings.get('stake_amount')}\n"
                      f"Paper: {ft.get('paperAcceptance')} WR {metrics.get('winRate')}% PnL {metrics.get('realizedPnl')}\n"
                      f"Symbols: {', '.join(settings.get('symbols') or [])}"
                  ))
              elif cmd == "health":
                  h = http_get("/api/health")
                  reply(chat, f"🩺 <pre>{json.dumps(h, indent=2)[:1500]}</pre>")
              elif cmd in ("pnl", "pnl_today"):
                  ft = http_get("/api/forward-test")
                  m = (ft or {}).get("metrics") or {}
                  reply(chat, f"📈 Wins {m.get('wins')} Losses {m.get('losses')} WR {m.get('winRate')}%\nPnL {m.get('realizedPnl')} avg {m.get('avgPnl')}")
              elif cmd == "positions":
                  mg = http_get("/api/manage")
                  reply(chat, f"💼 Open: {mg.get('openCount')}\nBalance: {mg.get('balance')}")
              elif cmd == "signals":
                  # last tick may be heavy; use dashboard if present
                  d = http_get("/api/dashboard")
                  reply(chat, f"🧠 Dashboard ok={d.get('ok')}\n<pre>{json.dumps(d, default=str)[:1200]}</pre>")
              elif cmd == "tick":
                  t = http_get("/api/tick")
                  logs = (t.get("logs") or [])[-12:]
                  reply(chat, f"⚡ Tick ok={t.get('ok')} skipped={t.get('skipped')}\n" + "\n".join(logs))
              elif cmd == "manage":
                  m = http_get("/api/manage")
                  reply(chat, f"🛠 Manage ok={m.get('ok')} open={m.get('openCount')} updated={len(m.get('updated') or [])}\nBal {m.get('balance')}")
              elif cmd == "mode":
                  reply(chat, "Mode changes via dashboard/settings for now. Use /status.")
              else:
                  reply(chat, f"Unknown /{cmd}. Try /help")

          if highest:
              tg("getUpdates", {"offset": highest + 1, "limit": 1})
              print(f"acked through {highest}")
          PY
