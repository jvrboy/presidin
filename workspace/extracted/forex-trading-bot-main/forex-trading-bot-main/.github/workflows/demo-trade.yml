name: Deriv Demo Trades
on:
  workflow_dispatch:
jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q websockets
      - name: run
        env:
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
        run: |
          export TRADE_OUT="$GITHUB_WORKSPACE/trades"
          python scripts/runner_trade.py
      - uses: actions/upload-artifact@v4
        with:
          name: trades-real
          path: trades/**
