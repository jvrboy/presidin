name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install (web)
        working-directory: apps/web
        run: npm install
      - name: Typecheck shared (basic)
        run: |
          cd packages/shared
          npx --yes tsc --noEmit --esModuleInterop --moduleResolution node --target ES2020 src/index.ts || true
