name: Demo Trade Burst
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Number of demo trade attempts'
        default: '1500'
      rounds:
        description: 'Tick/manage loops'
        default: '500'
  schedule:
    # keep collecting while collect mode on
    - cron: '*/3 * * * *'
concurrency:
  group: demo-burst
  cancel-in-progress: false
jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Burst tick + manage
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
          TARGET: ${{ github.event.inputs.target || '50' }}
          ROUNDS: ${{ github.event.inputs.rounds || '40' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = (os.environ.get('BOT_URL') or 'https://forex-trading-bot-lilac.vercel.app').rstrip('/')
          rounds = int(os.environ.get('ROUNDS') or 40)
          token = os.environ.get('TELEGRAM_BOT_TOKEN') or ''
          chat = os.environ.get('TELEGRAM_CHAT_ID') or ''

          def get(path, timeout=90):
            req = urllib.request.Request(base + path, headers={'x-worker-id': 'gh-burst'})
            with urllib.request.urlopen(req, timeout=timeout) as r:
              return json.loads(r.read())

          def tg(msg):
            if not token or not chat: return
            try:
              data = json.dumps({'chat_id': chat, 'text': msg[:3500]}).encode()
              req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=data, headers={'Content-Type':'application/json'})
              urllib.request.urlopen(req, timeout=20)
            except Exception as e:
              print('tg', e)

          executed = 0
          tg(f'🚀 Demo burst start · {rounds} rounds')
          for i in range(rounds):
            try:
              t = get('/api/tick')
              m = get('/api/manage')
              ex = len(t.get('executed') or [])
              executed += ex
              print(f'round {i+1}/{rounds} tick_ok={t.get("ok")} exec={ex} manage_upd={len(m.get("updated") or [])} skip={t.get("skipped")}')
              if (i+1) % 20 == 0:
                tg(f'Burst progress {i+1}/{rounds} · session exec signals {executed}')
            except Exception as e:
              print('err', e)
              time.sleep(2)
            time.sleep(1.5)
          tg(f'✅ Burst batch done · rounds={rounds} · signal-exec events≈{executed}')
          print('done', executed)
          PY
