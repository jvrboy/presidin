name: Backup Heartbeat (every 5 min)

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:        # manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel /api/heartbeat
        run: |
          if [ -z "${{ secrets.VERCEL_HEARTBEAT_URL }}" ]; then
            echo "VERCEL_HEARTBEAT_URL secret not set — skipping"
            exit 0
          fi
          curl -s -X POST "${{ secrets.VERCEL_HEARTBEAT_URL }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: github-actions-heartbeat" \
            -d '{"source":"github-actions","ts":'$(date +%s)'}' \
            --max-time 55 || true
