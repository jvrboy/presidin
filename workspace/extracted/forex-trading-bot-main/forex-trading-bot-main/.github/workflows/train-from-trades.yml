name: Train From Trades
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */2 * * *'
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Export closed trades + simple attribution
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, collections
          base = (os.environ.get('BOT_URL') or 'https://forex-trading-bot-lilac.vercel.app').rstrip('/')
          url = os.environ.get('SUPABASE_URL')
          key = os.environ.get('SUPABASE_SERVICE_ROLE_KEY')
          token = os.environ.get('TELEGRAM_BOT_TOKEN') or ''
          chat = os.environ.get('TELEGRAM_CHAT_ID') or ''

          def tg(msg):
            if not token or not chat: return
            try:
              data=json.dumps({'chat_id':chat,'text':msg[:3500]}).encode()
              req=urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=data, headers={'Content-Type':'application/json'})
              urllib.request.urlopen(req, timeout=20)
            except Exception as e:
              print('tg', e)

          def sb(path):
            req=urllib.request.Request(url+'/rest/v1/'+path, headers={'apikey':key,'Authorization':'Bearer '+key})
            with urllib.request.urlopen(req, timeout=60) as r:
              return json.loads(r.read())

          trades = sb('trades?select=symbol,direction,pnl,status,confidence,signal_source,review_label&status=in.(WON,LOST)&order=opened_at.desc&limit=2000')
          wins=[t for t in trades if float(t.get('pnl') or 0)>0]
          losses=[t for t in trades if float(t.get('pnl') or 0)<0]
          by_src=collections.Counter()
          loss_src=collections.Counter()
          for t in trades:
            src=(t.get('signal_source') or 'unknown')[:40]
            by_src[src]+=1
            if float(t.get('pnl') or 0)<0: loss_src[src]+=1
          wr = (len(wins)/len(trades)*100) if trades else 0
          pnl=sum(float(t.get('pnl') or 0) for t in trades)
          report=f"📚 Train snapshot n={len(trades)} WR={wr:.1f}% PnL={pnl:.2f}\nTop loss sources: {loss_src.most_common(5)}"
          print(report)
          tg(report)
          # trigger export if endpoint exists
          try:
            urllib.request.urlopen(base+'/api/monte-carlo?samples=1500&limit=500', timeout=90)
          except Exception as e:
            print('mc', e)
          PY
