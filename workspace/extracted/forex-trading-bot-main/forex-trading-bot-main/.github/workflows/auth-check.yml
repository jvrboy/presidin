name: Deriv Auth Check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q websockets
      - name: auth
        env:
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_ACCOUNT_TYPE: ${{ secrets.DERIV_ACCOUNT_TYPE }}
        run: |
          python - <<'PY'
          import asyncio, json, os
          import websockets
          token = os.environ.get("DERIV_TOKEN") or ""
          ai = (os.environ.get("DERIV_APP_ID") or "").strip()
          app_ids = [ai] if ai else []
          if "1089" not in app_ids: app_ids.append("1089")
          print("AUTH_R has_token=%s app_id_secret=%r acct_type=%r" % (bool(token), ai, os.environ.get("DERIV_ACCOUNT_TYPE")))
          async def go():
              for aid in app_ids:
                  try:
                      async with websockets.connect("wss://ws.derivws.com/websockets/v3?app_id="+aid, open_timeout=15) as ws:
                          await ws.send(json.dumps({"authorize": token}))
                          m = json.loads(await asyncio.wait_for(ws.recv(), timeout=15))
                          if m.get("authorize"):
                              a = m["authorize"]
                              print("AUTH_R OK app_id=%s loginid=%s virtual=%s currency=%s balance=%s scopes=%s" % (aid, a.get("loginid"), a.get("is_virtual"), a.get("currency"), a.get("balance"), a.get("scopes")))
                              return
                          elif m.get("error"):
                              print("AUTH_R FAIL app_id=%s code=%s msg=%s" % (aid, m["error"].get("code"), m["error"].get("message")))
                  except Exception as e:
                      print("AUTH_R CONN app_id=%s err=%s" % (aid, str(e)[:120]))
          asyncio.run(go())
          PY
