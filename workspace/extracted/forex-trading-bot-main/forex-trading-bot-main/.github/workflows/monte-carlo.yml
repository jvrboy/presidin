name: Monte Carlo Robustness
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
jobs:
  mc:
    runs-on: ubuntu-latest
    steps:
      - name: Run Monte Carlo API
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
        run: |
          URL="${BOT_URL:-https://forex-trading-bot-lilac.vercel.app}"
          echo "GET $URL/api/monte-carlo"
          curl -sS "$URL/api/monte-carlo?samples=2000&limit=200" \
            -H "x-worker-id: gh-mc" \
            --max-time 90 | tee /tmp/mc.json
          python3 -c "import json;d=json.load(open('/tmp/mc.json'));print(d);assert d.get('ok') is True"
