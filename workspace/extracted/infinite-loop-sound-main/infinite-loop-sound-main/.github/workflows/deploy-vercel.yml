name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.buildres.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        id: buildres
        run: |
          npm run build
          echo "ok=true" >> "$GITHUB_OUTPUT"
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Report build status
        if: always()
        run: |
          echo "::notice title=Build::Build ${{ steps.buildres.outputs.ok == 'true' && 'succeeded' || 'failed' }}"
          if [ "${{ steps.buildres.outputs.ok }}" != "true" ]; then
            echo "::error title=Build::Build failed — Vercel deploy will be skipped."
            exit 1
          fi

  deploy:
    needs: build-check
    if: ${{ needs.build-check.outputs.ok == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel secrets
        id: check-vercel-secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ]; then
            echo "::warning title=Missing Secrets::Vercel secrets are missing. Skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: ${{ steps.check-vercel-secrets.outputs.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ steps.check-vercel-secrets.outputs.skip != 'true' }}
        run: npm ci

      - name: Install Vercel CLI
        if: ${{ steps.check-vercel-secrets.outputs.skip != 'true' }}
        run: npm i -g vercel@latest

      - name: Pull Vercel Environment
        if: ${{ steps.check-vercel-secrets.outputs.skip != 'true' }}
        run: vercel pull --yes --token=${{ secrets.VERCEL_TOKEN }} --environment=production
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      - name: Build Project Artifacts
        if: ${{ steps.check-vercel-secrets.outputs.skip != 'true' }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      - name: Deploy to Vercel
        if: ${{ steps.check-vercel-secrets.outputs.skip != 'true' }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
