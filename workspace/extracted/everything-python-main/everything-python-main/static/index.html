<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVERYTHING</title>
<style>
:root{--bg:#0b0d12;--panel:#12151d;--border:#232837;--text:#e7eaf0;--muted:#8b93a5;--accent:#6366f1;--green:#22c55e;--red:#ef4444}
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--text)}
#app{display:flex;height:100vh}
aside{width:230px;background:var(--panel);border-right:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:6px}
aside h1{font-size:16px;margin:0 0 12px}
nav button{display:flex;width:100%;padding:9px 12px;background:none;border:1px solid transparent;border-radius:8px;color:var(--text);cursor:pointer;text-align:left;font:inherit}
nav button.active,nav button:hover{background:var(--accent);color:#fff}
main{flex:1;overflow:auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 12px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--text);cursor:pointer;font:inherit}
.chip.active{background:var(--accent);color:#fff;border-color:transparent}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;opacity:.6;font-size:12px;text-transform:uppercase;padding:10px;border-bottom:1px solid var(--border)}
td{padding:10px;border-top:1px solid var(--border)}
.bias{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.bullish{background:rgba(34,197,94,.15);color:var(--green)}.bearish{background:rgba(239,68,68,.15);color:var(--red)}.neutral{background:rgba(139,147,165,.15);color:var(--muted)}
.tp{color:var(--green)}.sl{color:var(--red)}
#chatlog{display:flex;flex-direction:column;gap:10px;min-height:300px}
.msg{padding:10px 14px;border-radius:12px;max-width:80%;white-space:pre-wrap}
.user{align-self:flex-end;background:var(--accent);color:#fff}
.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--border)}
#composer{display:flex;gap:8px;margin-top:14px}
#composer input{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);font:inherit}
button.primary{padding:12px 18px;background:var(--accent);color:#fff;border:none;border-radius:10px;cursor:pointer;font:inherit}
.muted{color:var(--muted);font-size:13px}
.login{max-width:340px;margin:15vh auto}
</style></head><body>
<div id="login" class="card login" style="display:none">
  <h2>EVERYTHING</h2><p class="muted">Sign in</p>
  <input id="pw" type="password" placeholder="Password" style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)">
  <button class="primary" style="width:100%;margin-top:10px" onclick="doLogin()">Sign in</button>
</div>
<div id="app" style="display:none">
  <aside><h1>⚡ EVERYTHING</h1>
    <nav>
      <button data-v="chat" class="active">💬 Chat</button>
      <button data-v="signals">📈 Signals</button>
      <button data-v="midi">🎹 MIDI</button>
      <button data-v="logs">🧾 Logs</button>
    </nav>
  </aside>
  <main id="main"></main>
</div>
<script>
const $=s=>document.querySelector(s);let view='chat',signals=[],quotes={},group='forex',timer=null;
const GROUPS=[['forex','Forex'],['indices','Indices'],['stocks','Stocks'],['crypto','Crypto'],['synthetics','Synthetics'],['metals','Metals']];
async function api(p,o){const r=await fetch(p,{credentials:'include',...o});return r.json()}
async function boot(){const s=await api('/api/auth/session');if(s.authenticated){$('#login').style.display='none';$('#app').style.display='flex';render()}else{$('#login').style.display='block'}}
async function doLogin(){const r=await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});if(r.ok)boot();else alert('Wrong password')}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));if(timer)clearTimeout(timer);render()});
async function loadSignals(g){group=g||group;const[s,q]=await Promise.all([api('/api/ai/signals?group='+group),api('/api/ai/quotes?group='+group).catch(()=>({quotes:{}}))]);signals=s.signals||[];quotes=q.quotes||{};render();if(view==='signals')timer=setTimeout(()=>loadSignals(group),10000)}
function signalsHtml(){const rows=signals.map(r=>{const q=quotes[r.instrument]||{};const p=q.price??r.entry;const b=r.bias;return `<tr><td><strong>${r.instrument}</strong>${p!=null?`<div class="muted">${p}</div>`:''}</td><td><span class="bias ${b}">${b.toUpperCase()}</span></td><td>${r.entry??'—'}</td><td class="tp">${r.tp??'—'}</td><td class="sl">${r.sl??'—'}</td><td>${r.confidence}%</td></tr>`}).join('');
 return `<div class="card"><h2>📈 Signals <span style="color:var(--green)">●</span></h2><div class="chips">${GROUPS.map(g=>`<button class="chip ${g[0]===group?'active':''}" onclick="loadSignals('${g[0]}')">${g[1]}</button>`).join('')}</div><table><thead><tr><th>Instrument</th><th>Bias</th><th>Entry</th><th>TP</th><th>SL</th><th>Confidence</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="muted">Loading…</td></tr>'}</tbody></table></div>`}
function chatHtml(){return `<div class="card"><h2>💬 Chat</h2><div id="chatlog"></div><div id="composer"><input id="msg" placeholder="Message…" onkeydown="if(event.key==='Enter')send()"><button class="primary" onclick="send()">Send</button></div></div>`}
async function send(){const i=$('#msg');const t=i.value.trim();if(!t)return;i.value='';const log=$('#chatlog');log.innerHTML+=`<div class="msg user">${t.replace(/</g,'&lt;')}</div>`;const th=document.createElement('div');th.className='msg ai';th.textContent='…';log.appendChild(th);log.scrollTop=1e9;
 const r=await api('/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:t}]})});
 th.textContent=r.ok?(r.content||'(empty)'):('⚠️ '+(r.error||'failed'));log.scrollTop=1e9}
function midiHtml(){return `<div class="card"><h2>🎹 MIDI</h2><div class="chips"><select id="mood" style="padding:8px;border-radius:8px;background:var(--bg);color:var(--text);border:1px solid var(--border)"><option>cinematic</option><option>emotional</option><option>epic</option></select><input id="bars" type="number" value="32" style="width:80px;padding:8px;border-radius:8px;background:var(--bg);color:var(--text);border:1px solid var(--border)"><button class="primary" onclick="genMidi()">Compose</button><button class="primary" onclick="genAmapiano()">Amapiano ZIP</button></div><div id="midiout" class="muted"></div></div>`}
function dl(name,b64,mime){const a=document.createElement('a');a.href='data:'+mime+';base64,'+b64;a.download=name;a.click()}
async function genMidi(){const r=await api('/api/build/midi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mood:$('#mood').value,bars:+$('#bars').value})});if(r.ok)dl(r.name,r.base64,r.mimeType);$('#midiout').textContent=r.ok?'✅ '+r.name:'⚠️ '+r.error}
async function genAmapiano(){const r=await api('/api/build/midi/amapiano',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bars:+$('#bars').value})});if(r.ok)dl(r.name,r.base64,r.mimeType);$('#midiout').textContent=r.ok?'✅ '+r.name:'⚠️ '+r.error}
async function logsHtml(){const r=await api('/api/logs/summary');const rows=(r.activity||[]).map(a=>`<tr><td class="muted">${(a.created_at||'').slice(0,19)}</td><td>${a.event}</td><td class="muted">${JSON.stringify(a.detail||{}).slice(0,120)}</td></tr>`).join('');return `<div class="card"><h2>🧾 Logs</h2><table><tbody>${rows||'<tr><td class="muted">No logs yet.</td></tr>'}</tbody></table></div>`}
async function render(){const m=$('#main');if(view==='chat')m.innerHTML=chatHtml();else if(view==='signals'){m.innerHTML=signalsHtml();if(!signals.length)loadSignals()}else if(view==='midi')m.innerHTML=midiHtml();else if(view==='logs')m.innerHTML=await logsHtml()}
boot();
</script></body></html>
