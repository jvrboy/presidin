# Nginx reverse-proxy config for the Nexus Trade backend.
#
# Terminates TLS and forwards plain HTTP to the backend on localhost:8000.
# Usage:
#   sudo cp backend/python_app/nginx.conf /etc/nginx/sites-available/nexus-backend
#   sudo ln -s /etc/nginx/sites-available/nexus-backend /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace nexus.example.com with your real domain.
# Get your TLS cert via:
#   sudo certbot --nginx -d nexus.example.com

# Rate limiting at the nginx layer (in addition to the app's built-in
# per-IP limiter) — protects against the most aggressive floods before
# they ever reach Python.
limit_req_zone $binary_remote_addr zone=nexus_api:10m rate=10r/s;

upstream nexus_backend {
    server 127.0.0.1:8000 fail_timeout=10s max_fails=3;
    keepalive 32;
}

server {
    listen 80;
    server_name nexus.example.com;

    # Redirect HTTP -> HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name nexus.example.com;

    # TLS — cert paths from certbot.
    ssl_certificate /etc/letsencrypt/live/nexus.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexus.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP — allow inline styles (FastAPI's bundled UI needs them) but
    # disallow inline scripts and third-party origins.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Disable nginx buffering for streaming endpoints (SSE / WebSocket).
    proxy_buffering off;
    proxy_request_buffering off;

    # API + WebSocket endpoints.
    location / {
        limit_req zone=nexus_api burst=20 nodelay;

        proxy_pass http://nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Static files — served directly by nginx for better performance.
    location /static/ {
        alias /opt/nexus-backend/app/ui/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Health endpoint — bypass rate limiting so external health
    # checks don't get 429'd.
    location = /api/health {
        proxy_pass http://nexus_backend;
        access_log off;
    }

    # Max request body size — 50 MB matches the FastAPI app's limit.
    client_max_body_size 50M;
}
