name: CI — Lint + Type-check + Test

# Runs on every push to main and on every pull request. Fast (under
# 2 minutes) — fails the build before the expensive mobile/web build
# jobs in build-mobile.yml even start. Catches type errors, lint
# regressions, and test failures early.
#
# This workflow is the gate: build-mobile.yml should ideally depend
# on it via workflow_run, but for now it just runs in parallel.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: pnpm check / lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (tsc --noEmit)
        run: pnpm check

      - name: Lint (eslint)
        run: pnpm lint

      - name: Test (vitest)
        run: pnpm test

  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/python_app/requirements.txt') }}

      - name: Install backend deps
        working-directory: backend/python_app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run backend pytest
        working-directory: backend/python_app
        run: python -m pytest tests/ --ignore=tests/test_provider_adapters.py -p no:cacheprovider --tb=short
